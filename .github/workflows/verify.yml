name: Verify game

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check script syntax
        run: |
          node --check app.js
          node --check engine.js
          node --check profile.js
          node --check data.js
      - name: Verify bundled resources and local links
        run: node scripts/verify-publication.cjs
      - name: Verify game rules and complete journeys
        run: node engine-test.cjs
      - name: Verify saves, history, and achievements
        run: node --test profile-test.cjs
